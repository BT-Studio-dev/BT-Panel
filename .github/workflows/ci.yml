name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://btpanel:ci-only@127.0.0.1:5432/btpanel
      SEED_DEMO: "false"
      COOKIE_SECURE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint integration and module files
        run: npx eslint src/components/panel/views/pterodactyl-view.tsx src/components/panel/shell.tsx src/lib/panel/modules.ts src/lib/panel/types.ts src/lib/server/pterodactyl.ts src/app/api/integrations/pterodactyl
      - name: Build
        run: npm run build
