name: PHP Minecraft panel

on:
  push:
    paths:
      - "minecraft-panel/**"
      - ".github/workflows/php-panel.yml"
  pull_request:
    paths:
      - "minecraft-panel/**"
      - ".github/workflows/php-panel.yml"

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, mbstring, curl
          coverage: none

      - name: Lint every PHP file
        working-directory: minecraft-panel
        run: |
          find . -name '*.php' -not -path './storage/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /tmp/lint.log || { cat /tmp/lint.log; exit 1; }
          tail -3 /tmp/lint.log

      - name: Smoke test (database, auth, provisioning, paths, views)
        working-directory: minecraft-panel
        run: php tests/run-smoke.php

      - name: Front-controller routes
        working-directory: minecraft-panel
        run: |
          php tests/run-http.php GET /login | grep -q "Sign in"
          php tests/run-http.php GET /api/health | grep -q '"status":"ok"'
          php tests/run-http.php GET /api/servers --guest | grep -q 'Sign in to continue'
          php tests/run-http.php POST /api/servers | grep -q 'session token expired'

      - name: JavaScript syntax
        run: node --check minecraft-panel/public/assets/app.js
