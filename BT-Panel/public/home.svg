<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Home">
  <defs>
    <linearGradient id="h-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef2b2b"/>
      <stop offset="0.55" stop-color="#c40f0f"/>
      <stop offset="1" stop-color="#7a0808"/>
    </linearGradient>
    <linearGradient id="h-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5252"/>
      <stop offset="1" stop-color="#a80e0e"/>
    </linearGradient>
    <linearGradient id="h-door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b0a0a"/>
      <stop offset="1" stop-color="#420505"/>
    </linearGradient>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="24.5" cy="41.6" rx="13.5" ry="3.6" fill="rgba(0,0,0,0.45)"/>
  <!-- roof right slope (extruded depth) -->
  <path d="M21 13.4 L27.5 6.9 L37.5 16.5 L31 23 Z" fill="#8f0b0b"/>
  <!-- body right wall (extruded depth) -->
  <path d="M29 22 L35.5 15.5 L35.5 31 L29 38 Z" fill="#6e0707"/>
  <!-- roof front face -->
  <path d="M11 23 L21 13.4 L31 23 Z" fill="url(#h-roof)"/>
  <!-- body front face -->
  <rect x="13" y="22" width="16" height="16" rx="1.6" fill="url(#h-front)"/>
  <!-- window -->
  <rect x="24" y="26.8" width="3.6" height="3.6" rx="0.9" fill="#ffe3e3"/>
  <path d="M25.8 26.8 v3.6 M24 28.6 h3.6" stroke="#c40f0f" stroke-width="0.9"/>
  <!-- door -->
  <rect x="18.2" y="27.5" width="5.4" height="10.5" rx="2.4" fill="url(#h-door)"/>
  <circle cx="22.2" cy="33" r="0.8" fill="#ffd9d9"/>
</svg>
