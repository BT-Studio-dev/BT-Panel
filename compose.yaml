services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-btpanel}
      POSTGRES_USER: ${POSTGRES_USER:-btpanel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-btpaneldemo}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bt-panel-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-btpanel} -d ${POSTGRES_DB:-btpanel}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  bt-panel-postgres:
