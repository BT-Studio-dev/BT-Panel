# BT Panel reverse proxy — installed to /etc/nginx/sites-available/bt-panel.conf
# Replace panel.example.com with your domain (setup-debian.sh does this for you).

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;

    # Wallpaper / logo uploads travel as JSON payloads
    client_max_body_size 16m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets: cache forever
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
